	<h1 id="id_Toc157509602" dir="rtl" class="block_26">چھبیسویں فصل</h1>
	<p dir="rtl" class="block_4"> </p>
	<h1 id="id_Toc157509603" dir="rtl" class="block_11">احادیث کے مشکل الفاظ کے معنی میں</h1>
	<p dir="rtl" class="block_4"> </p>
	<p dir="rtl" class="block_15"><span dir="ltr"></span>اس باب کی آخری فصل میں احادیث کے غریب اور مشکل الفاظ کا ترجمہ صاحب کتاب الشفاء نے کیا ہے، چونکہ ترجمہ میں وہ گزرچکی ہیں، اس لیے غیر ضروری سمجھ کر چھوڑ دیا گیا۔ (مترجم)۔</p>
