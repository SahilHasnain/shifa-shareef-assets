	<h1 id="id_Toc165911089" dir="rtl" class="block_23">تیسرا باب</h1>
	<p dir="rtl" class="block_"> </p>
	<p dir="rtl" class="block_40">اس شخص کے حکم کے بارے جو اللہ عزوجل ، اس کے رسولوں ، فرشتوں اور کتابوں اور انبیاء علیہم السلام کی آل کو برا کہتا ہے،اس کی نوفصلیں ہیں۔</p>

</span></p>
