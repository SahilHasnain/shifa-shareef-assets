<body><main class="book section-book"><h2>The Meaning Of Revelation</h2>
<p>The original meaning of <span class="reference">wahy</span> is to incline or turn toward something. When a command from Allah <sup>عز وجل</sup> descended upon Huzoor <sup>عليه السلام</sup>, he would turn toward receiving it. For this reason, it was called <span class="reference">wahy</span>. There is further linguistic discussion regarding this word.</p></main></body>
