<body><main class="book section-book"><h2>Passing Away</h2>
<p>He <sup>رحمة الله تعالى عليه</sup> passed away on the night of Friday, 9 Jumada al-Akhirah 544 AH, corresponding to 1145 CE. He was buried in Marrakesh. His blessed age was approximately sixty-nine years.</p></main></body>
